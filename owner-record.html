<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VetMoto - Owner Records</title>
<link rel="stylesheet" href="style.css">
<script>
    // Session Protection Check
    if (!sessionStorage.getItem("vetmoto_user")) {
        window.location.href = "index.html";
    }
    function logout() {
        sessionStorage.removeItem("vetmoto_user");
        window.location.href = "index.html";
    }
</script>
</head>

<body>
<div class="dashboard">

<aside class="sidebar">
<img src="vetmoto-logo.webp" class="side-logo">
<h2>VETMOTO</h2>

<a href="dashboard.html">⌂ Home</a>
<a href="pet-record.html">▤ Pet Record</a>
<a href="owner-record.html" class="active">♧ Owner Record</a>
<a href="medicine.html">💊 Medicine</a>
<a href="clinic-charge.html">▭ Clinic Charge</a>
<a href="appointment.html">◷ Appointment</a>
<a href="notifications.html">♧ Notification</a>
<a href="history.html">▦ History</a>
<a href="#" onclick="logout(); return false;" class="logout">LOG OUT</a>
</aside>

<main class="main-content">

<h1>OWNER RECORDS</h1>

<button onclick="addOwnerModal()">ADD Owner</button>

<br><br>

<input id="searchOwner"
placeholder="Search owner ID, name, contact, or email..."
onkeyup="searchOwnerData()">

<br><br>

<table>
<thead>
<tr>
<th>User ID</th>
<th>PHOTO</th>
<th>NAME</th>
<th>Contact</th>
<th>Email</th>
<th>ACTIONS</th>
</tr>
</thead>

<tbody id="ownerTable">
<!-- Dynamically populated via JavaScript -->
</tbody>
</table>

</main>
</div>

<script>
    // LocalStorage & JSON Array Data Simulation for Owners (IT107 CRUD Requirement)[cite: 2]
    let owners = JSON.parse(localStorage.getItem("vetmoto_owners")) || [
        { id: "OR-1042", photo: "👤", name: "Noah Anderson", contact: "086742111", email: "noah@xample.com" },
        { id: "OR-1043", photo: "👤", name: "Maya Patel", contact: "09123456789", email: "maya@xample.com" }
    ];

    function renderOwners(data = owners) {
        const tbody = document.getElementById("ownerTable");
        tbody.innerHTML = "";

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #888; padding: 20px;">No owner records found.</td></tr>`;
            return;
        }

        data.forEach(owner => {
            tbody.innerHTML += `
                <tr>
                    <td>${owner.id}</td>
                    <td>${owner.photo}</td>
                    <td><b>${owner.name}</b></td>
                    <td>${owner.contact}</td>
                    <td>${owner.email}</td>
                    <td>
                        <button onclick="location.href='owner-profile.html?id=${owner.id}'" style="padding: 5px 10px; font-size: 12px;">View</button>
                        <button onclick="editOwner('${owner.id}')" style="padding: 5px 10px; font-size: 12px;">Edit</button>
                        <button onclick="deleteOwner('${owner.id}')" style="background: #E85B5B; padding: 5px 10px; font-size: 12px; color: white; border: none; border-radius: 4px; cursor: pointer;">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    // CREATE / ADD Owner Function (IT107 Requirement)[cite: 2]
    function addOwnerModal() {
        const name = prompt("Enter Owner Name:");
        if (!name) return;
        const contact = prompt("Enter Contact Number:");
        const email = prompt("Enter Email Address:");

        const newOwner = {
            id: "OR-" + Math.floor(1000 + Math.random() * 9000),
            photo: "👤",
            name: name,
            contact: contact || "N/A",
            email: email || "N/A"
        };

        owners.push(newOwner);
        localStorage.setItem("vetmoto_owners", JSON.stringify(owners));
        renderOwners();
    }

    // UPDATE Owner Function (IT107 Requirement)[cite: 2]
    function editOwner(id) {
        const owner = owners.find(o => o.id === id);
        if (!owner) return;

        const newName = prompt("Edit Owner Name:", owner.name);
        if (newName === null) return;
        const newContact = prompt("Edit Contact Number:", owner.contact);
        const newEmail = prompt("Edit Email Address:", owner.email);

        owner.name = newName || owner.name;
        owner.contact = newContact || owner.contact;
        owner.email = newEmail || owner.email;

        localStorage.setItem("vetmoto_owners", JSON.stringify(owners));
        renderOwners();
    }

    // DELETE Owner Function (IT107 Requirement)[cite: 2]
    function deleteOwner(id) {
        if (confirm("Are you sure you want to delete this owner record?")) {
            owners = owners.filter(o => o.id !== id);
            localStorage.setItem("vetmoto_owners", JSON.stringify(owners));
            renderOwners();
        }
    }

    // SEARCH / FILTER Function (IT107 Requirement)[cite: 2]
    function searchOwnerData() {
        const query = document.getElementById("searchOwner").value.toLowerCase();
        const filtered = owners.filter(o => 
            o.id.toLowerCase().includes(query) ||
            o.name.toLowerCase().includes(query) ||
            o.contact.toLowerCase().includes(query) ||
            o.email.toLowerCase().includes(query)
        );
        renderOwners(filtered);
    }

    // Initial load on page start
    window.onload = function() {
        renderOwners();
    };
</script>
</body>
</html>
