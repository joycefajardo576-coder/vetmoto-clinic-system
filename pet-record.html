<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VetMoto - Pet Records</title>
<link rel="stylesheet" href="style.css">
<script>
    // Session Protection Check
    if (!sessionStorage.getItem("vetmoto_user")) {
        window.location.href = "index.html";
    }
    function logout() {
        sessionStorage.removeItem("vetmoto_user");
        window.location.href = "index.html";
    }
</script>
</head>
<body>

<div class="dashboard">

<aside class="sidebar">
  <img src="vetmoto-logo.webp" class="side-logo" alt="VetMoto Logo">
  <h2>VETMOTO</h2>

  <a href="dashboard.html">⌂ Home</a>
  <a href="pet-record.html" class="active">▤ Pet Record</a>
  <a href="owner-record.html">♧ Owner Record</a>
  <a href="medicine.html">💊 Medicine</a>
  <a href="clinic-charge.html">▭ Clinic Charge</a>
  <a href="appointment.html">◷ Appointment</a>
  <a href="notifications.html">♧ Notification</a>
  <a href="history.html">▦ History</a>
  <a href="#" onclick="logout(); return false;" class="logout">LOG OUT</a>
</aside>

<main class="main-content">
  <h1>PET RECORDS</h1>
  <p>View and manage registered pets.</p>
  <br>

  <button onclick="location.href='add-pet.html'">+ ADD NEW PET</button>
  <br><br>

  <input
    id="petSearch"
    type="text"
    placeholder="Search pet ID, name, species, breed, or owner"
    oninput="searchPetData()"
  >

  <br><br>

<table>
  <thead>
    <tr>
      <th>Pet ID</th>
      <th>Pet</th>
      <th>Pet Name</th>
      <th>Species</th>
      <th>Breed</th>
      <th>Owner</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="petTable">
    <!-- Dynamically populated via JavaScript -->
  </tbody>
</table>

</main>
</div>

<script>
    // LocalStorage & JSON Array Data Simulation for Pets (IT107 CRUD Requirement)[cite: 2]
    let pets = JSON.parse(localStorage.getItem("vetmoto_pets")) || [
        { id: "PR-1042", icon: "🐾", name: "Luna", species: "Dog", breed: "Golden Retriever", owner: "Maya Patel" },
        { id: "PR-1043", icon: "🐾", name: "Milo", species: "Cat", breed: "Persian", owner: "Carlos Reyes" }
    ];

    function renderPets(data = pets) {
        const tbody = document.getElementById("petTable");
        tbody.innerHTML = "";

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #888; padding: 20px;">No pet records found.</td></tr>`;
            return;
        }

        data.forEach(pet => {
            tbody.innerHTML += `
                <tr>
                    <td>${pet.id}</td>
                    <td>${pet.icon}</td>
                    <td><b>${pet.name}</b></td>
                    <td>${pet.species}</td>
                    <td>${pet.breed}</td>
                    <td>${pet.owner}</td>
                    <td>
                        <button onclick="location.href='pet-profile.html?id=${pet.id}'" style="padding: 5px 10px; font-size: 12px;">View</button>
                        <button onclick="location.href='edit-pet.html?id=${pet.id}'" style="padding: 5px 10px; font-size: 12px;">Edit</button>
                        <button onclick="deletePet('${pet.id}')" style="background: #E85B5B; padding: 5px 10px; font-size: 12px; color: white; border: none; border-radius: 4px; cursor: pointer;">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    // SEARCH / FILTER Function (IT107 Requirement)[cite: 2]
    function searchPetData() {
        const query = document.getElementById("petSearch").value.toLowerCase();
        const filtered = pets.filter(p => 
            p.id.toLowerCase().includes(query) ||
            p.name.toLowerCase().includes(query) ||
            p.species.toLowerCase().includes(query) ||
            p.breed.toLowerCase().includes(query) ||
            p.owner.toLowerCase().includes(query)
        );
        renderPets(filtered);
    }

    // DELETE Operation (IT107 Requirement)[cite: 2]
    function deletePet(id) {
        if (confirm("Are you sure you want to delete this pet record?")) {
            pets = pets.filter(p => p.id !== id);
            localStorage.setItem("vetmoto_pets", JSON.stringify(pets));
            renderPets();
        }
    }

    // Initial load on page start
    window.onload = function() {
        renderPets();
    };
</script>

</body>
</html>
