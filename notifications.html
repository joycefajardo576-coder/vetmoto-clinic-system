<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VetMoto | Notifications</title>
<script>
  if (!sessionStorage.getItem("vetmoto_user")) {
    window.location.href = "index.html";
  }
  function logout() {
    sessionStorage.removeItem("vetmoto_user");
    window.location.href = "index.html";
  }
</script>
<style>
  :root {
    --purple: #5b3a82;
    --lavender: #f3ecfb;
    --coral: #e85b5b;
    --cream: #fbf7f4;
    --bg: #f5effa;
    --white: #fff;
    --text: #4a3560;
    --border: #e0d4ec;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
  .layout { display: flex; min-height: 100vh; }
  
  /* CONSISTENT SIDEBAR STYLING */
  .sidebar { width: 205px; background: var(--purple); color: #fff; padding: 18px 16px; display: flex; flex-direction: column; flex-shrink: 0; }
  .logo { height: 104px; width: 104px; border-radius: 50%; background: white; color: var(--purple); display: grid; place-items: center; text-align: center; font-weight: bold; margin: 0 auto 12px; font-size: 13px; line-height: 1.2; }
  .brand { text-align: center; font-weight: bold; margin-bottom: 18px; letter-spacing: 1px; }
  .nav a { display: block; color: white; text-decoration: none; padding: 12px 8px; border-top: 1px solid #ffffff33; font-size: 13px; }
  .nav a.active, .nav a:hover { background: #714c9e; }
  .logout { margin-top: auto; background: var(--coral); color: white; border: 0; border-radius: 9px; padding: 12px; font-weight: bold; cursor: pointer; text-align: center; }

  /* MAIN CONTENT */
  main { flex: 1; min-width: 0; padding: 28px 36px; background: var(--bg); }
  .eyebrow { font-size: 12px; color: #806b91; text-transform: uppercase; margin-bottom: 4px; }
  h1 { margin: 0 0 6px; color: var(--purple); font-size: 26px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
  .subtitle { margin: 0 0 20px; color: #806b91; font-size: 13px; }

  .card { background: white; border-radius: 14px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
  .notif-item { background: var(--cream); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .notif-title { font-weight: bold; color: var(--purple); font-size: 14px; margin-bottom: 4px; }
  .notif-sub { font-size: 12px; color: #666; }
  .btn-del { background: var(--coral); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold; }
  .btn-add { background: var(--purple); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 15px; font-size: 12px; }

  @media(max-width: 768px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; }
  }
</style>
</head>
<body>

<div class="layout">
  <!-- SIDEBAR WITH CONSISTENT LOGO -->
  <aside class="sidebar">
    <div class="logo">🐾<br>VETMOTO</div>
    <div class="brand">VETMOTO</div>
    <nav class="nav">
      <a href="dashboard.html">⌂ Home</a>
      <a href="pet-record.html">▤ Pet Record</a>
      <a href="owner-record.html">♙ Owner Record</a>
      <a href="medicine.html">▱ Medicine</a>
      <a href="clinic-charge.html">▣ Clinic Charge</a>
      <a href="appointment.html">◷ Appointment</a>
      <a href="notifications.html" class="active">♧ Notification</a>
      <a href="history.html">▦ History</a>
    </nav>
    <button class="logout" onclick="logout()">LOG OUT</button>
  </aside>

  <!-- MAIN -->
  <main>
    <div class="eyebrow">Clinic staff / Notifications</div>
    <h1>NOTIFICATIONS</h1>
    <p class="subtitle">System alerts, vaccination reminders, and appointment updates.</p>

    <button class="btn-add" onclick="addNotification()">+ NEW NOTIFICATION ALERT</button>

    <div class="card">
      <div id="notifList"></div>
    </div>
  </main>
</div>

<script>
  function initNotifications() {
    const saved = localStorage.getItem("vetmoto_notifications");
    if (!saved) {
      const defaults = [
        { id: 1, title: "💉 Vaccination Due Reminder", detail: "Pet: Luna (Owner: Maya Patel) - Anti-Rabies Booster Due Tomorrow", time: "10 mins ago" },
        { id: 2, title: "📅 New Appointment Booked", detail: "Pet: Cooper - Consultation with Dr. Maya Patel scheduled at 2:00 PM", time: "1 hour ago" },
        { id: 3, title: "💊 Low Medicine Stock", detail: "Amoxicillin 250mg stock is below 15 units.", time: "3 hours ago" }
      ];
      localStorage.setItem("vetmoto_notifications", JSON.stringify(defaults));
    }
  }

  function loadNotifications() {
    const list = JSON.parse(localStorage.getItem("vetmoto_notifications") || "[]");
    const container = document.getElementById("notifList");

    if (list.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding:20px; color:#888; font-size:13px;">No notifications at the moment.</div>`;
      return;
    }

    container.innerHTML = list.map((item, index) => `
      <div class="notif-item">
        <div>
          <div class="notif-title">${item.title}</div>
          <div class="notif-sub">${item.detail}</div>
          <span style="font-size:10px; color:#999; margin-top:4px; display:block;">${item.time}</span>
        </div>
        <button class="btn-del" onclick="deleteNotification(${index})">CLEAR</button>
      </div>
    `).join("");
  }

  function addNotification() {
    const title = prompt("Enter Notification Title:");
    if (!title) return;
    const detail = prompt("Enter Notification Message / Details:");
    
    const list = JSON.parse(localStorage.getItem("vetmoto_notifications") || "[]");
    list.unshift({
      id: Date.now(),
      title: "📢 " + title,
      detail: detail || "General Clinic Notice",
      time: "Just now"
    });

    localStorage.setItem("vetmoto_notifications", JSON.stringify(list));
    loadNotifications();
  }

  function deleteNotification(index) {
    const list = JSON.parse(localStorage.getItem("vetmoto_notifications") || "[]");
    list.splice(index, 1);
    localStorage.setItem("vetmoto_notifications", JSON.stringify(list));
    loadNotifications();
  }

  initNotifications();
  loadNotifications();
</script>

</body>
</html>
