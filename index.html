<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VetMoto | Login & Sign Up</title>
<style>
  :root {
    --purple: #5b3a82;
    --lavender: #f3ecfb;
    --coral: #e85b5b;
    --bg: #f5effa;
    --text: #4a3560;
    --border: #e0d4ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: white;
    width: 100%;
    max-width: 400px;
    padding: 30px;
    border-radius: 18px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    text-align: center;
  }
  .logo {
    height: 90px;
    width: 90px;
    border-radius: 50%;
    background: white;
    color: var(--purple);
    border: 2px solid var(--purple);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: bold;
    margin: 0 auto 12px auto;
    font-size: 11px;
    line-height: 1.2;
    overflow: hidden;
  }
  .logo img {
    width: 85%;
    height: 85%;
    object-fit: contain;
  }
  .brand-title {
    font-size: 18px;
    font-weight: bold;
    color: var(--purple);
    margin: 0 0 15px;
    letter-spacing: 1px;
  }
  .tab-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--purple);
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
  }
  .tab-btn.active {
    background: var(--purple);
    color: white;
    border-color: var(--purple);
  }
  .form-group {
    text-align: left;
    margin-bottom: 14px;
  }
  .form-group label {
    display: block;
    font-size: 10px;
    font-weight: bold;
    color: #806b91;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .form-group input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    color: var(--text);
  }
  .btn-submit {
    width: 100%;
    background: var(--coral);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
    margin-top: 8px;
    text-transform: uppercase;
  }
  .btn-submit:hover { opacity: 0.9; }
  .form-pane { display: none; }
  .form-pane.active { display: block; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <img src="vetmoto-logo.webp" alt="VetMoto Logo" onerror="this.onerror=null; this.parentNode.innerHTML='🐾<br>VETMOTO';">
  </div>
  <div class="brand-title">VETMOTO CLINIC</div>

  <!-- TABS -->
  <div class="tab-buttons">
    <button class="tab-btn active" id="tab-login-btn" onclick="switchTab('login')">LOGIN</button>
    <button class="tab-btn" id="tab-signup-btn" onclick="switchTab('signup')">CREATE ACCOUNT</button>
  </div>

  <!-- LOGIN FORM -->
  <form id="pane-login" class="form-pane active" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email / Username</label>
      <input type="text" id="loginUser" placeholder="Enter verified email or username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Enter password" required>
    </div>
    <button type="submit" class="btn-submit">LOGIN</button>
  </form>

  <!-- SIGN UP FORM (Kailangang mag-sign up muna at i-verify) -->
  <form id="pane-signup" class="form-pane" onsubmit="handleSignUp(event)">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="regName" placeholder="Enter full name" required>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="regEmail" placeholder="Enter email for verification" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPass" placeholder="Create password" required>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="regConfirmPass" placeholder="Confirm password" required>
    </div>
    <button type="submit" class="btn-submit" style="background:var(--purple);">SIGN UP & VERIFY</button>
  </form>

</div>

<script>
  if (sessionStorage.getItem("vetmoto_user")) {
    window.location.href = "dashboard.html";
  }

  function switchTab(tab) {
    document.querySelectorAll('.form-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('pane-' + tab).classList.add('active');
    document.getElementById('tab-' + tab + '-btn').classList.add('active');
  }

  function handleSignUp(e) {
    e.preventDefault();
    const name = document.getElementById("regName").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const pass = document.getElementById("regPass").value;
    const confirmPass = document.getElementById("regConfirmPass").value;

    if (pass !== confirmPass) {
      alert("Passwords do not match!");
      return;
    }

    // I-save ang registered account sa localStorage para ma-verify sa login
    const accounts = JSON.parse(localStorage.getItem("vetmoto_accounts") || "[]");
    
    // Check kung meron na
    if (accounts.some(acc => acc.email === email)) {
      alert("Account with this email already exists!");
      return;
    }

    accounts.push({ name, email, pass, verified: true });
    localStorage.setItem("vetmoto_accounts", JSON.stringify(accounts));

    // May verification prompt bago magtagumpay
    alert("Account created successfully! [VERIFIED] \nYour account has been verified. You may now log in.");
    
    // Lumipat pabalik sa Login tab
    switchTab('login');
    document.getElementById("loginUser").value = email;
  }

  function handleLogin(e) {
    e.preventDefault();
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value.trim();

    const accounts = JSON.parse(localStorage.getItem("vetmoto_accounts") || "[]");
    
    // Default account kung wala pang nare-register
    if (accounts.length === 0) {
      accounts.push({ name: "Admin", email: "admin", pass: "admin123", verified: true });
      localStorage.setItem("vetmoto_accounts", JSON.stringify(accounts));
    }

    const found = accounts.find(acc => (acc.email === user || acc.name === user) && acc.pass === pass);

    if (found) {
      if (!found.verified) {
        alert("Account is not verified yet. Please check your verification status.");
        return;
      }
      sessionStorage.setItem("vetmoto_user", JSON.stringify({ username: found.name, email: found.email, loginTime: new Date() }));
      alert("Login successful! Welcome to VetMoto.");
      window.location.href = "dashboard.html";
    } else {
      alert("Invalid username/email or password, or account is unverified. Please Sign Up first.");
    }
  }
</script>

</body>
</html>
