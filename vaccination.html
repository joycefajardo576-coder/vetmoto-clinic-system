
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetMoto - Vaccination Records</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .vaccine-form {
      background: #FFF9F2;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
    }

    .vaccine-form input,
    .vaccine-form select,
    .vaccine-form textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 6px 0 14px;
      border: 1px solid #D7C8E8;
      border-radius: 8px;
    }

    .vaccine-actions button {
      margin: 3px;
    }

    .vaccine-table {
      width: 100%;
      border-collapse: collapse;
    }

    .vaccine-table th,
    .vaccine-table td {
      padding: 10px;
      border-bottom: 1px solid #E9DDF7;
      text-align: left;
    }

    .vaccine-table th {
      background: #5B3A82;
      color: white;
    }

    .delete-button {
      background: #E85B5B !important;
      color: white;
    }

    .cancel-button {
      background: #E85B5B !important;
      color: white;
    }

    .search-box {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 10px 0 20px;
      border: 1px solid #D7C8E8;
      border-radius: 8px;
    }
  </style>
</head>

<body>
<div class="dashboard">

  <aside class="sidebar">
    <img src="vetmoto-logo.webp" class="side-logo" alt="VetMoto Logo">
    <h2>VETMOTO</h2>
    <a href="dashboard.html">⌂ Home</a>
    <a href="pet-record.html">🐾 Pet Records</a>
    <a href="owner-record.html">♧ Owner Records</a>
    <a href="medicine.html">💊 Medicine</a>
    <a href="appointment.html">◷ Appointment</a>
    <a href="prescription.html">▤ Prescription</a>
    <a href="surgery.html">✚ Surgery</a>
    <a href="index.html" class="logout">LOG OUT</a>
  </aside>

  <main class="main-content">
    <a href="dashboard.html">← Back to Dashboard</a>

    <h1 style="margin-top:20px;">VACCINATION RECORDS</h1>
    <p>Manage and review pet vaccination history.</p>

    <button type="button" onclick="newVaccine()">
      + ADD VACCINATION
    </button>

    <form id="vaccineForm" class="vaccine-form" hidden>
      <h2 id="formTitle">Add Vaccination</h2>

      <label for="vaccineId">Record ID</label>
      <input id="vaccineId" required placeholder="Enter record ID">

      <label for="petName">Pet Name</label>
      <input id="petName" required placeholder="Enter pet name">

      <label for="ownerName">Owner Name</label>
      <input id="ownerName" required placeholder="Enter owner name">

      <label for="vaccineName">Vaccine Name</label>
      <input id="vaccineName" required placeholder="Enter vaccine name">

      <label for="vaccinationDate">Vaccination Date</label>
      <input id="vaccinationDate" type="date" required>

      <label for="nextDate">Next Vaccination Date</label>
      <input id="nextDate" type="date">

      <label for="veterinarian">Veterinarian</label>
      <input id="veterinarian" placeholder="Enter veterinarian's name">

      <label for="vaccineNotes">Notes</label>
      <textarea id="vaccineNotes" rows="3"
        placeholder="Enter notes"></textarea>

      <label for="vaccineStatus">Status</label>
      <select id="vaccineStatus">
        <option>Completed</option>
        <option>Scheduled</option>
        <option>Overdue</option>
      </select>

      <button type="submit">SAVE RECORD</button>
      <button type="button" class="cancel-button"
        onclick="cancelVaccine()">CANCEL</button>
    </form>

    <label for="vaccineSearch">Search Records</label>
    <input id="vaccineSearch" class="search-box"
      placeholder="Search ID, pet, owner, or vaccine..."
      oninput="renderVaccines()">

    <div style="overflow-x:auto;">
      <table class="vaccine-table">
        <thead>
          <tr>
            <th>Record ID</th>
            <th>Pet</th>
            <th>Owner</th>
            <th>Vaccine</th>
            <th>Date</th>
            <th>Next Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="vaccineTable"></tbody>
      </table>
    </div>

    <p id="emptyMessage" hidden>No vaccination records found.</p>
  </main>
</div>

<script>
const vaccineForm = document.getElementById("vaccineForm");
const vaccineTable = document.getElementById("vaccineTable");
let editingVaccineIndex = -1;

function getVaccines() {
  try {
    return JSON.parse(
      localStorage.getItem("vetmotoVaccinations") || "[]"
    );
  } catch (error) {
    return [];
  }
}

function saveVaccines(records) {
  localStorage.setItem(
    "vetmotoVaccinations",
    JSON.stringify(records)
  );
}

function newVaccine() {
  editingVaccineIndex = -1;
  vaccineForm.reset();
  document.getElementById("formTitle").textContent =
    "Add Vaccination";
  vaccineForm.hidden = false;
  vaccineForm.scrollIntoView({ behavior: "smooth" });
}

function cancelVaccine() {
  vaccineForm.reset();
  vaccineForm.hidden = true;
  editingVaccineIndex = -1;
}

vaccineForm.addEventListener("submit", function(event) {
  event.preventDefault();

  const records = getVaccines();

  const record = {
    id: document.getElementById("vaccineId").value.trim(),
    pet: document.getElementById("petName").value.trim(),
    owner: document.getElementById("ownerName").value.trim(),
    vaccine: document.getElementById("vaccineName").value.trim(),
    date: document.getElementById("vaccinationDate").value,
    nextDate: document.getElementById("nextDate").value,
    veterinarian: document.getElementById("veterinarian").value.trim(),
    notes: document.getElementById("vaccineNotes").value.trim(),
    status: document.getElementById("vaccineStatus").value
  };

  const duplicate = records.some((item, index) =>
    item.id === record.id && index !== editingVaccineIndex
  );

  if (duplicate) {
    alert("This Record ID already exists.");
    return;
  }

  if (editingVaccineIndex >= 0) {
    records[editingVaccineIndex] = record;
  } else {
    records.push(record);
  }

  saveVaccines(records);
  cancelVaccine();
  renderVaccines();
  alert("Vaccination record saved successfully!");
});

function viewVaccine(index) {
  const item = getVaccines()[index];
  if (!item) return;

  alert(
    "VACCINATION DETAILS\n\n" +
    "Record ID: " + item.id +
    "\nPet: " + item.pet +
    "\nOwner: " + item.owner +
    "\nVaccine: " + item.vaccine +
    "\nDate: " + item.date +
    "\nNext Date: " + (item.nextDate || "—") +
    "\nVeterinarian: " + (item.veterinarian || "—") +
    "\nStatus: " + item.status +
    "\nNotes: " + (item.notes || "—")
  );
}

function editVaccine(index) {
  const item = getVaccines()[index];
  if (!item) return;

  editingVaccineIndex = index;

  document.getElementById("formTitle").textContent =
    "Edit Vaccination";
  document.getElementById("vaccineId").value = item.id;
  document.getElementById("petName").value = item.pet;
  document.getElementById("ownerName").value = item.owner;
  document.getElementById("vaccineName").value = item.vaccine;
  document.getElementById("vaccinationDate").value = item.date;
  document.getElementById("nextDate").value = item.nextDate || "";
  document.getElementById("veterinarian").value =
    item.veterinarian || "";
  document.getElementById("vaccineNotes").value = item.notes || "";
  document.getElementById("vaccineStatus").value = item.status;

  vaccineForm.hidden = false;
  vaccineForm.scrollIntoView({ behavior: "smooth" });
}

function deleteVaccine(index) {
  const records = getVaccines();
  if (!records[index]) return;

  if (!confirm("Are you sure you want to delete this record?")) {
    return;
  }

  records.splice(index, 1);
  saveVaccines(records);
  renderVaccines();
}

function renderVaccines() {
  const records = getVaccines();
  const query = document.getElementById("vaccineSearch")
    .value.trim().toLowerCase();

  const matches = records
    .map((item, index) => ({ item, index }))
    .filter(({ item }) =>
      [
        item.id, item.pet, item.owner,
        item.vaccine, item.status
      ].some(value =>
        String(value || "").toLowerCase().includes(query)
      )
    );

  vaccineTable.replaceChildren();

  matches.forEach(({ item, index }) => {
    const row = vaccineTable.insertRow();

    [
      item.id, item.pet, item.owner, item.vaccine,
      item.date, item.nextDate || "—", item.status
    ].forEach(value => {
      row.insertCell().textContent = value || "—";
    });

    const actions = row.insertCell();
    actions.className = "vaccine-actions";

    const viewButton = document.createElement("button");
    viewButton.textContent = "VIEW";
    viewButton.onclick = () => viewVaccine(index);

    const editButton = document.createElement("button");
    editButton.textContent = "EDIT";
    editButton.onclick = () => editVaccine(index);

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "DELETE";
    deleteButton.className = "delete-button";
    deleteButton.onclick = () => deleteVaccine(index);

    actions.append(viewButton, editButton, deleteButton);
  });

  document.getElementById("emptyMessage").hidden =
    matches.length > 0;
}

renderVaccines();
</script>
</body>
</html>
